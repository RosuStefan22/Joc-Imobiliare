name: Build iOS IPA
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout cod
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalare dependente
        run: npm install

      - name: Sincronizare iOS
        run: npx cap sync ios

      - name: Compilare Xcode (Fara semnatura)
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO build
          cd ../..
          mkdir -p Payload
          mv ios/App/build/Release-iphoneos/App.app Payload/
          zip -r LandlordEmpire.ipa Payload

      - name: Descarcare IPA
        uses: actions/upload-artifact@v4
        with:
          name: LandlordEmpire-IPA
          path: LandlordEmpire.ipa
